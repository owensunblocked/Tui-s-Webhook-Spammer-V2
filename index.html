<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuis Webhook V2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 30px;
      max-width: 750px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .top-buttons {
      text-align: center;
      margin-bottom: 20px;
    }

    .slot {
      background: #1f2937;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }

    .slot h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      color: #d1d5db;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      background: #374151;
      color: white;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin: 5px 5px 5px 0;
    }

    button:hover {
      opacity: 0.85;
    }

    .add {
      background: #3b82f6;
      color: white;
    }

    .press {
      background: #22c55e;
      color: white;
    }

    .stop {
      background: #ef4444;
      color: white;
    }

    .remove {
      background: #6b7280;
      color: white;
    }

    .counter {
      margin-top: 10px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <h1>Tuis Webhook V2</h1>

  <div class="top-buttons">
    <button class="add" onclick="addSlot()">＋ Add Webhook Slot</button>
    <button class="stop" onclick="stopSpeaking()">⏹ Stop</button>
  </div>

  <div id="slots"></div>

  <script>
    let slotNumber = 0;

    // Add a new webhook slot
    function addSlot() {
      slotNumber++;

      const slot = document.createElement("div");
      slot.className = "slot";

      slot.innerHTML = `
        <h3>Webhook Slot ${slotNumber}</h3>

        <label>Webhook URL</label>
        <input
          type="url"
          class="webhook"
          placeholder="Paste your webhook URL here..."
        >

        <label>What should it say?</label>
        <input
          type="text"
          class="message"
          placeholder="Type what you want it to say..."
        >

        <button class="press" onclick="pressWebhook(this)">
          🔊 PRESS
        </button>

        <button class="remove" onclick="removeSlot(this)">
          🗑 Remove
        </button>

        <div class="counter">Ready</div>
      `;

      document.getElementById("slots").appendChild(slot);
    }

    // Press button
    function pressWebhook(button) {
      const slot = button.parentElement;

      const webhook = slot.querySelector(".webhook").value.trim();
      const message = slot.querySelector(".message").value.trim();
      const counter = slot.querySelector(".counter");

      if (!webhook) {
        alert("Please enter a webhook URL!");
        return;
      }

      if (!message) {
        alert("Please type something to say!");
        return;
      }

      // Stop any current speech
      speechSynthesis.cancel();

      let count = 0;

      function sayNext() {
        if (count >= 30) {
          counter.textContent = "✅ Finished 30 times!";
          return;
        }

        count++;
        counter.textContent = "🔊 Saying " + count + " / 30";

        const speech = new SpeechSynthesisUtterance(message);

        speech.onend = function () {
          sayNext();
        };

        speech.onerror = function () {
          counter.textContent = "❌ Speech error";
        };

        speechSynthesis.speak(speech);
      }

      sayNext();
    }

    // Stop speaking
    function stopSpeaking() {
      speechSynthesis.cancel();

      document.querySelectorAll(".counter").forEach(counter => {
        counter.textContent = "⏹ Stopped";
      });
    }

    // Remove slot
    function removeSlot(button) {
      button.parentElement.remove();
    }

    // Add first slot automatically
    addSlot();
  </script>

</body>
</html>
